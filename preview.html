<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Invitation Preview - InviteMe</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar">

        <div class="logo">
            💌 InviteMe
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

        </div>

    </nav>



    <!-- =========================
         FINAL PREVIEW
    ========================== -->

    <section class="final-preview-section">


        <div class="final-header">

            <p class="small-title">
                YOUR INVITATION IS READY
            </p>

            <h1>
                Final Preview
            </h1>

            <p>
                This is how your invitation will look.
            </p>

        </div>



        <!-- =========================
             INVITATION
        ========================== -->

        <div
            id="finalInvitation"
            class="final-invitation">


            <p class="final-small">
                YOU'RE INVITED
            </p>


            <div
                id="finalIcon"
                class="final-icon">

                🎉

            </div>


            <h1 id="finalTitle">
                Your Event
            </h1>


            <p class="final-host">

                Hosted by

                <strong id="finalHost">
                    Your Name
                </strong>

            </p>


            <div class="final-details">

                <p>

                    📅

                    <span id="finalDate">
                        Date
                    </span>

                </p>


                <p>

                    ⏰

                    <span id="finalTime">
                        Time
                    </span>

                </p>


                <p>

                    📍

                    <span id="finalLocation">
                        Location
                    </span>

                </p>

            </div>


            <p
                id="finalMessage"
                class="final-message">

                Your special message
                will appear here.

            </p>


        </div>



        <!-- =========================
             BUTTONS
        ========================== -->
<div class="final-buttons">

    <button
        class="back-btn"
        onclick="backToCustomize()">

        ← Back

    </button>


    <button
        class="share-btn"
        onclick="shareInvitation()">

        🔗 Share Invitation

    </button>

</div>


<!-- =========================
     SHARE LINK
========================= -->

<div
    id="shareLinkBox"
    style="display: none; margin-top: 20px;">

    <p>
        🔗 <strong>Your Invitation Link</strong>
    </p>

    <input
        type="text"
        id="shareLinkInput"
        readonly
        style="width: 100%; padding: 10px;">

    <button
        type="button"
        onclick="copyInvitationLink()"
        style="margin-top: 10px; padding: 10px 20px;">

        📋 Copy Link

    </button>

</div>
       
    </section>


    <script src="script.js"></script>

</body>

</html>
