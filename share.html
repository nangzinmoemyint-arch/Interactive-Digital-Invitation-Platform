<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Share Invitation - InviteMe</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            💌 InviteMe
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
        </div>

    </nav>


    <section class="share-section">

        <div class="share-card">

            <div class="share-icon">
                🔗
            </div>

            <p class="small-title">
                YOUR INVITATION IS READY
            </p>

            <h1>
                Share Your Invitation
            </h1>

            <p>
                Copy the link below and send it to your guests.
            </p>


            <div class="share-link-box">

                <input
                    type="text"
                    id="shareLink"
                    readonly>

                <button
                    onclick="copyInvitationLink()">

                    Copy

                </button>

            </div>


            <p
                id="copyMessage"
                class="copy-message">
            </p>


            <div class="share-buttons">

                <button
                    class="back-btn"
                    onclick="backToPreview()">

                    ← Back

                </button>


                <button
                    class="home-btn"
                    onclick="goHome()">

                    🏠 Home

                </button>

            </div>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
