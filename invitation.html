<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Invitation - InviteMe</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <section class="guest-invitation-section">

        <div
            id="guestInvitation"
            class="guest-invitation">


            


            <!-- SMALL TITLE -->

            <p class="guest-small">
                YOU'RE INVITED
            </p>


            <!-- EVENT ICON -->

            <div
                id="guestIcon"
                class="guest-icon">

                🎉

            </div>


            <!-- EVENT TITLE -->

            <h1 id="guestTitle">
                Your Event
            </h1>


            <!-- HOST -->

            <p class="guest-host">

                Hosted by

                <strong id="guestHost">
                    Your Name
                </strong>

            </p>


            <!-- DETAILS -->

            <div class="guest-details">

                <p>

                    📅

                    <span id="guestDate">
                        Date
                    </span>

                </p>


                <p>

                    🕐

                    <span id="guestTime">
                        Time
                    </span>

                </p>


                <p>

                    📍

                    <span id="guestLocation">
                        Location
                    </span>

                </p>

            </div>


            <!-- MESSAGE -->

            <p
                id="guestMessage"
                class="guest-message">

                Your special message
                will appear here.

            </p>


        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
